name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: py${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install editable with dev extra
        run: python -m pip install -e ".[dev]"

      - name: Sprint layout gate (methodology binding)
        run: python tools/check_sprint_layout.py

      - name: Layout gate mutation verification (11 mutations must go red)
        run: python tools/verify_layout_gate.py

      - name: AST gate mutation verification (8 mutations must go red)
        run: python tools/verify_ast_gates.py

      - name: Module mutation verification (11 semantic faults must go red)
        run: python tools/verify_module_mutations.py

      - name: Fixture generators are idempotent (--check)
        run: |
          python tools/gen_dkim_fixtures.py --check
          python tools/gen_dmarc_fixtures.py --check
          python tools/gen_reconcile_fixtures.py --check
          python tools/gen_whatif_fixtures.py --check
          python tools/gen_examples.py --check

      - name: AST gate - no network outside net.py
        run: python tools/check_no_network.py

      - name: AST gate - no direct json serialization
        run: python tools/check_no_direct_json.py

      - name: AST gate - no system clock
        run: python tools/check_no_clock.py

      - name: Fixture hygiene (reserved domains only)
        run: python tools/check_fixture_hygiene.py

      - name: Forbidden terms (strict-evidence)
        run: python tools/check_forbidden_terms.py

      - name: Offline smoke (audit never opens a socket)
        run: python tools/offline_smoke.py

      # 发布门的 `--offline` 档不碰网络，所以在 CI 里是可跑的那一档。
      # `--pre-tag` 会在 tag 推送时假红（tag 已存在），`--online` 需要远端状态——都不在 CI 跑。
      - name: Release gate (offline mode)
        run: python tools/check_release.py --offline

      - name: Tests
        run: python -m pytest

      - name: CLI smoke (console entry point)
        run: |
          mailvault --version
          mailvault --help

  offline:
    name: offline no-network job
    runs-on: ubuntu-latest
    # **不要把 job 放进容器**：Actions 总是给 job 容器挂一个 user-defined network，
    # 再叠加 `container.options: --network none` 会得到
    #   docker: conflicting options: cannot attach both user-defined and
    #   non-user-defined network-modes（实测 run 39526291036，Initialize containers exit 125）。
    # 正确做法是在普通 runner 上用 `docker run --network none` 起**嵌套**容器——
    # `--network none` 只在 `docker run` 这一层合法。构建期可联网（拉基础镜像），
    # 运行期完全无网络，这正是要证明的那件事。
    steps:
      - uses: actions/checkout@v4

      - name: Build offline image
        run: docker build -f .github/offline.Dockerfile -t mailvault-offline .

      - name: Offline smoke inside network-less container
        run: docker run --rm --network none mailvault-offline python tools/offline_smoke.py

      # `--network none` 里能跑通 = 发布门 `--offline` 档真的不需要网络。
      - name: Release gate offline mode needs no network
        run: docker run --rm --network none mailvault-offline python tools/check_release.py --offline

      # 再证一次：判定路径真的不需要装任何第三方包。
      - name: Runtime has zero third-party imports (no install step at all)
        run: docker run --rm --network none mailvault-offline python -c "import mailvault, sys; print('version', mailvault.__version__); print('third-party:', [m for m in sys.modules if m in ('yaml','cryptography','requests')])"
