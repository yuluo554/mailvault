[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailvault"
description = "离线邮件认证判定账本：SPF/DKIM/DMARC 在同一份 DNS 快照上求值，逐条挂 RFC 条款与求值轨迹"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "yuluo554" }]
keywords = ["spf", "dkim", "dmarc", "email-authentication", "rfc7208", "rfc9989", "cli"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Communications :: Email :: Filters",
  "Topic :: Security",
]
# 版本单一真源 = mailvault/__init__.py 的 __version__（勿在此写死第二份）。
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mailvault = "mailvault.cli:main"

[project.urls]
Homepage = "https://github.com/yuluo554/mailvault"

[tool.setuptools.dynamic]
version = { attr = "mailvault.__version__" }

[tool.setuptools.packages.find]
include = ["mailvault*"]

[tool.setuptools.package-data]
mailvault = ["data/*.dat", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
