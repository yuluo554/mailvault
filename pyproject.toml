[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mailvault"
description = "离线邮件认证判定账本：SPF/DKIM/DMARC 在同一份 DNS 快照上求值，逐条挂 RFC 条款与求值轨迹"
readme = "README.md"
requires-python = ">=3.11"
# PEP 639：SPDX 表达式字符串（TOML 表写法已被 setuptools 弃用，硬期限 2027-02-18）
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yuluo554" }]
keywords = ["spf", "dkim", "dmarc", "email-authentication", "rfc7208", "rfc9989", "cli"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Communications :: Email :: Filters",
  "Topic :: Security",
]
# 版本单一真源 = mailvault/__init__.py 的 __version__（勿在此写死第二份）。
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
# 运行时**零第三方依赖**（dependencies = []）。下列只用于测试期：
# - pytest：测试运行器
# - pyyaml：只用来读 `fixtures/spf/rfc7208-tests.yml`（上游 RFC 7208 测试集）。
#   该文件用了锚点/别名、流式集合、块标量等 YAML 特性，自己写解析器等于重造轮子且必然漏。
#   **运行时不引入**：`mailvault/` 包内零 `import yaml`，由 `tests/test_determinism.py`
#   的 `test_runtime_has_no_third_party_imports` 扫描断言。
# - cryptography：只给 `tools/gen_dkim_fixtures.py` 签样本 + `tests/test_dkim.py`
#   的参照实现对账用。**运行时不引入**（零依赖 RSA 在 `mailvault/crypto/`）。
dev = ["pytest>=8", "pyyaml>=6", "cryptography>=42"]

[project.scripts]
mailvault = "mailvault.cli:main"

[project.urls]
Homepage = "https://github.com/yuluo554/mailvault"

[tool.setuptools.dynamic]
version = { attr = "mailvault.__version__" }

[tool.setuptools.packages.find]
include = ["mailvault*"]

[tool.setuptools.package-data]
mailvault = ["data/*.dat", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
